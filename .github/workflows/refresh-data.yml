# Refresh factual records on the committed snapshot. Preserve every existing profile,
# relationship identity, photo, donation, judgment and manually curated controversy.
name: Refresh data

on:
  # Dispatched by the daily 17:00 Taipei maintenance heartbeat alongside elections/policies.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Fetch and merge verified factual records
        id: refresh
        run: |
          pnpm exec tsx scraper/scripts/refresh-snapshot.ts
          node -e 'const fs = require("node:fs"); const status = JSON.parse(fs.readFileSync("scraper/out-refresh/status.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${status.changed}\n`);'
      - name: Validate snapshot
        run: pnpm exec vitest run scraper/test/refreshSnapshot.test.ts
      - name: Build changed snapshot
        if: steps.refresh.outputs.changed == 'true'
        run: pnpm build
      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factual-refresh-evidence
          path: |
            scraper/out-refresh/status.json
            scraper/out-refresh/failure.json
          if-no-files-found: ignore
      - name: Commit snapshot and its date together
        run: |
          if git diff --quiet -- src/data/officials.json src/data/meta.json; then
            echo "No data changes; snapshot date remains unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/officials.json src/data/meta.json
            git commit -m "chore(data): refresh factual records $(date -u +%Y-%m-%d)"
            # A concurrent push rejects this publication instead of overwriting newer work.
            git push
          fi
